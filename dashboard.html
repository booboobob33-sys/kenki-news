<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建設機械市場指標ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e29;
    --border: #252a38;
    --accent: #e8c84a;
    --accent2: #4a9ee8;
    --accent3: #e8714a;
    --text: #e8ecf4;
    --text-dim: #6b7494;
    --text-mid: #9da5bf;
    --green: #4ae8a0;
    --red: #e84a6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── ヘッダー ── */
  header {
    padding: 48px 48px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  }
  .header-left h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 4vw, 52px);
    letter-spacing: 0.08em;
    color: var(--text);
    line-height: 1;
  }
  .header-left .subtitle {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .header-right {
    text-align: right;
  }
  .update-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .update-time {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    margin-top: 4px;
  }
  .loading-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    margin-top: 8px;
    border-radius: 2px;
    overflow: hidden;
  }
  .loading-bar-inner {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.5s ease;
    border-radius: 2px;
  }

  /* ── カテゴリラベル ── */
  .category-header {
    padding: 32px 48px 0;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .category-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .cat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ── グリッド ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 1px;
    background: var(--border);
    margin: 24px 48px 0;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  /* ── カード ── */
  .card {
    background: var(--surface);
    padding: 28px 28px 20px;
    position: relative;
    transition: background 0.2s;
  }
  .card:hover {
    background: var(--surface2);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
    font-weight: 400;
  }
  .card-unit {
    font-size: 13px;
    color: var(--text-mid);
    margin-top: 5px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    font-weight: 400;
  }
  .card-value-block {
    text-align: right;
  }
  .card-value {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .card-date {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }
  .card-note {
    font-size: 10px;
    color: #666;
    line-height: 1.5;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #2a2a2a;
  }
  .card-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
    margin-top: 6px;
  }
  .card-status.loading {
    background: rgba(107,116,148,0.15);
    color: var(--text-dim);
  }
  .card-status.ok {
    background: rgba(74,232,160,0.1);
    color: var(--green);
  }
  .card-status.error {
    background: rgba(232,74,107,0.1);
    color: var(--red);
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .status-dot.static { animation: none; }

  /* ── チャート ── */
  .chart-wrap {
    position: relative;
    height: 140px;
    margin: 0 -4px;
  }

  /* ── フッター ── */
  footer {
    padding: 32px 48px;
    margin-top: 48px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-note {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .footer-sources {
    font-size: 10px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.8;
  }
  .footer-sources span {
    color: var(--text-mid);
  }

  /* ── スケルトン ── */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 2px;
  }
  .skeleton-value { width: 110px; height: 28px; display: inline-block; }
  .skeleton-chart { width: 100%; height: 140px; }

  /* ── レスポンシブ ── */
  @media (max-width: 768px) {
    header, .category-header, .grid, footer {
      padding-left: 20px;
      padding-right: 20px;
      margin-left: 0;
      margin-right: 0;
    }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>建設機械市場指標</h1>
    <div class="subtitle">Construction Machinery Market Indicators Dashboard</div>
  </div>
  <div class="header-right">
    <div class="update-label">Last Updated</div>
    <div class="update-time" id="updateTime">—</div>
    <div class="loading-bar"><div class="loading-bar-inner" id="loadingBar"></div></div>
  </div>
</header>

<div id="dashboardRoot"></div>

<footer>
  <div class="footer-note">© 建設機械市場指標ダッシュボード｜毎週月曜自動更新</div>
  <div class="footer-sources">
    <span>DATA SOURCES:</span><br>
    FRED (St. Louis Fed) / Eurostat / OECD / freegoldapi.com
  </div>
</footer>

<script src="./dashboard.js"></script>
</body>
</html>
